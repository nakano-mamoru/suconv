<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>suconv - 文字列変換ツール</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      background: #f0f2f5;
      color: #333;
      margin: 0;
      padding: 24px 16px;
      min-height: 100vh;
    }

    h1 {
      text-align: center;
      font-size: 1.8rem;
      margin: 0 0 24px;
      color: #1a1a2e;
      letter-spacing: 0.05em;
    }

    .container {
      max-width: 860px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card {
      background: #fff;
      border-radius: 8px;
      padding: 16px 20px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
    }

    .card label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 0.9rem;
      color: #555;
    }

    select {
      width: 100%;
      padding: 8px 12px;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: #fff;
      cursor: pointer;
      appearance: auto;
    }

    select:focus {
      outline: none;
      border-color: #4a90e2;
      box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.15);
    }

    .description {
      margin-top: 10px;
      padding: 10px 14px;
      background: #f8f9fb;
      border-left: 4px solid #4a90e2;
      border-radius: 4px;
      font-size: 0.9rem;
      color: #444;
      line-height: 1.6;
    }

    .options-area {
      margin-top: 12px;
    }

    .options-area:empty {
      display: none;
    }

    .option-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
      font-size: 0.9rem;
    }

    .option-row label {
      font-weight: 500;
      margin: 0;
      min-width: 120px;
      color: #444;
    }

    .option-row input[type="checkbox"] {
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    textarea {
      width: 100%;
      padding: 10px 12px;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.95rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      resize: vertical;
      line-height: 1.5;
      background: #fdfdfd;
      transition: border-color 0.2s;
    }

    textarea:focus {
      outline: none;
      border-color: #4a90e2;
      box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.15);
    }

    textarea[readonly] {
      background: #f4f6f9;
      color: #333;
    }

    .actions {
      display: flex;
      justify-content: center;
    }

    button#convertBtn {
      padding: 10px 40px;
      font-size: 1rem;
      font-weight: 600;
      background: #4a90e2;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      letter-spacing: 0.05em;
    }

    button#convertBtn:hover {
      background: #357abd;
    }

    button#convertBtn:active {
      transform: scale(0.97);
    }

    .error-msg {
      color: #c0392b;
      font-size: 0.85rem;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <h1>suconv</h1>

  <div class="container">
    <!-- コンバータ選択 -->
    <div class="card">
      <label for="converterSelect">コンバータ</label>
      <select id="converterSelect"></select>
      <div class="description" id="converterDescription"></div>
      <div class="options-area" id="converterOptions"></div>
    </div>

    <!-- 入力 -->
    <div class="card">
      <label for="inputText">入力</label>
      <textarea id="inputText" rows="8" placeholder="変換するテキストを入力してください"></textarea>
    </div>

    <!-- 変換ボタン -->
    <div class="actions">
      <button id="convertBtn">変換</button>
    </div>

    <!-- 結果 -->
    <div class="card">
      <label for="outputText">結果</label>
      <textarea id="outputText" rows="8" readonly placeholder="変換結果がここに表示されます"></textarea>
      <div class="error-msg" id="errorMsg"></div>
    </div>
  </div>

  <script>
    // ─── コンバータ定義 ────────────────────────────────────────────────────────
    const CONVERTERS = [
      {
        id: 'utf8-to-base64',
        name: 'UTF-8 → Base64',
        description: '入力テキストを UTF-8 バイト配列にエンコードし、Base64 文字列として出力します。',
        options: [
          {
            id: 'urlSafe',
            label: 'URL セーフ (+ → -, / → _)',
            type: 'checkbox',
            defaultValue: false,
          },
        ],
        convert(input, opts) {
          const encoder = new TextEncoder();
          const bytes = encoder.encode(input);
          let binary = '';
          for (let i = 0; i < bytes.length; i++) {
            binary += String.fromCharCode(bytes[i]);
          }
          let base64 = btoa(binary);
          if (opts.urlSafe) {
            base64 = base64.replace(/\+/g, '-').replace(/\//g, '_');
          }
          return base64;
        },
      },
    ];

    // ─── 状態 ─────────────────────────────────────────────────────────────────
    let currentConverter = CONVERTERS[0];

    // ─── DOM 参照 ─────────────────────────────────────────────────────────────
    const converterSelect = document.getElementById('converterSelect');
    const converterDescription = document.getElementById('converterDescription');
    const converterOptions = document.getElementById('converterOptions');
    const inputText = document.getElementById('inputText');
    const outputText = document.getElementById('outputText');
    const convertBtn = document.getElementById('convertBtn');
    const errorMsg = document.getElementById('errorMsg');

    // ─── 初期化 ───────────────────────────────────────────────────────────────
    function init() {
      // ドロップダウンにコンバータを追加
      CONVERTERS.forEach(conv => {
        const option = document.createElement('option');
        option.value = conv.id;
        option.textContent = conv.name;
        converterSelect.appendChild(option);
      });

      // 最初のコンバータを表示
      renderConverterUI(CONVERTERS[0]);

      // イベント
      converterSelect.addEventListener('change', () => {
        const conv = CONVERTERS.find(c => c.id === converterSelect.value);
        if (conv) {
          currentConverter = conv;
          renderConverterUI(conv);
          outputText.value = '';
          errorMsg.textContent = '';
        }
      });

      convertBtn.addEventListener('click', runConvert);
    }

    // ─── コンバータ UI 描画 ───────────────────────────────────────────────────
    function renderConverterUI(conv) {
      converterDescription.textContent = conv.description;
      converterOptions.innerHTML = '';

      conv.options.forEach(opt => {
        const row = document.createElement('div');
        row.className = 'option-row';

        const label = document.createElement('label');
        label.htmlFor = 'opt-' + opt.id;
        label.textContent = opt.label;

        let input;
        if (opt.type === 'checkbox') {
          input = document.createElement('input');
          input.type = 'checkbox';
          input.id = 'opt-' + opt.id;
          input.checked = opt.defaultValue;
        }

        row.appendChild(label);
        if (input) row.appendChild(input);
        converterOptions.appendChild(row);
      });
    }

    // ─── オプション値取得 ─────────────────────────────────────────────────────
    function getOptionValues(conv) {
      const opts = {};
      conv.options.forEach(opt => {
        const el = document.getElementById('opt-' + opt.id);
        if (!el) return;
        if (opt.type === 'checkbox') {
          opts[opt.id] = el.checked;
        }
      });
      return opts;
    }

    // ─── 変換実行 ─────────────────────────────────────────────────────────────
    function runConvert() {
      errorMsg.textContent = '';
      outputText.value = '';

      const input = inputText.value;
      const opts = getOptionValues(currentConverter);

      try {
        const result = currentConverter.convert(input, opts);
        outputText.value = result;
      } catch (e) {
        errorMsg.textContent = 'エラー: ' + e.message;
      }
    }

    init();
  </script>
</body>
</html>
